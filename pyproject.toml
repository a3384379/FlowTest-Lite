[project]
name = "flowtest-lite"
version = "0.1.0"
description = "Local HTTP API workbench and workflow runner"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jmespath>=1,<2",
  "jsonpath-ng>=1.7,<2",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.22,<1",
  "pyyaml>=6.0.2,<7",
  "uvicorn>=0.34,<1",
]

[tool.uv]
package = false
